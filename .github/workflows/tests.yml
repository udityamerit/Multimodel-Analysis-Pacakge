name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04  # pin the runner so older Python builds stay available
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check multimodel_analysis tests
      - name: Test
        env:
          MPLBACKEND: Agg
        shell: bash
        run: |
          set +e
          pytest -q -rfE --tb=short 2>&1 | tee pytest_out.txt
          code=${PIPESTATUS[0]}
          if [ "$code" != "0" ]; then
            grep -E "^(FAILED|ERROR)|^E  " pytest_out.txt | head -20 | cut -c1-300 | while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit $code
