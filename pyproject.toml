[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodel_analysis"
dynamic = ["version"]
description = "A Python package for automatic multi-model analysis (classification, regression and clustering)"
readme = "readme.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Uditya Narayan Tiwari", email = "tiwarimerit@gmail.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "numpy>=1.22",
    "pandas>=1.4",
    "matplotlib>=3.5",
    "seaborn>=0.12",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
excel = ["openpyxl>=3.0"]
boost = ["xgboost>=1.7", "lightgbm>=3.3", "catboost>=1.2"]
dev = ["pytest>=7", "ruff>=0.4", "openpyxl>=3.0"]

[project.urls]
Homepage = "https://github.com/udityamerit/Multimodel-Analysis-Pacakge"
Documentation = "https://udityamerit.github.io/Multimodel-Analysis-Pacakge-Documentation/"

[tool.setuptools.packages.find]
include = ["multimodel_analysis*"]

[tool.setuptools.dynamic]
version = { attr = "multimodel_analysis.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
